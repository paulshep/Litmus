[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus-validate"
version = "0.1.0"
description = "Behavioral control validation for cloud environments, mapped to OSCAL"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["security", "compliance", "oscal", "aws", "cedar", "nist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "moto[s3,iam]>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
litmus = "litmus.cli.main:cli"

[project.urls]
Homepage = "https://github.com/paulshep/litmus"
Repository = "https://github.com/paulshep/litmus"
Issues = "https://github.com/paulshep/litmus/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
